# Reusable SSH readiness check: the container is "healthy" once sshd accepts
# TCP connections on port 22 (so `docker compose up` / `make up` only report
# ready when Ansible can actually reach the node). Uses bash's /dev/tcp.
x-ssh-healthcheck: &ssh-healthcheck
  test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/22'"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: ansible-master
    hostname: master
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.10
    volumes:
      - ./ansible:/root/ansible
    healthcheck: *ssh-healthcheck

  mysqldb1:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: ansible-mysqldb1
    hostname: mysqldb1
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.11
    healthcheck:
      # DB nodes are healthy only when both MySQL and sshd are up.
      <<: *ssh-healthcheck
      test: ["CMD-SHELL", "bash -c 'mysqladmin ping -h 127.0.0.1 --silent && : >/dev/tcp/127.0.0.1/22'"]
      start_period: 30s

  mysqldb2:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: ansible-mysqldb2
    hostname: mysqldb2
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.12
    healthcheck:
      <<: *ssh-healthcheck
      test: ["CMD-SHELL", "bash -c 'mysqladmin ping -h 127.0.0.1 --silent && : >/dev/tcp/127.0.0.1/22'"]
      start_period: 30s

  host1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansible-host1
    hostname: host1
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.13
    healthcheck: *ssh-healthcheck

  host2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansible-host2
    hostname: host2
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.14
    healthcheck: *ssh-healthcheck

