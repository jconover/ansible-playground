#      context: .
#      dockerfile: Dockerfile
#    container_name: ansible-host3
#    hostname: host3
#    networks:
#      ansible-lab:
#        ipv4_address: 172.25.0.15

networks:
  ansible-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
