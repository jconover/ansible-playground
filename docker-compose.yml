services:
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: ansible-master
    hostname: master
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.10
    volumes:
      - ./ansible:/root/ansible

  mysqldb1:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: ansible-mysqldb1
    hostname: mysqldb1
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.11

  mysqldb2:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: ansible-mysqldb2
    hostname: mysqldb2
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.12

  host1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansible-host1
    hostname: host1
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.13

  host2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansible-host2
    hostname: host2
    networks:
      ansible-lab:
        ipv4_address: 172.25.0.14

#  host3:
